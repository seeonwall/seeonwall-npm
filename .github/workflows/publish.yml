name: Publish

# Publishing is driven by a GitHub Release, so the tag, the release notes and the
# published version are decided in one place. Bump the version in package.json,
# merge, then cut a release whose tag matches.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required to mint the OIDC token that npm trusted publishing exchanges for
      # a short-lived credential. No npm token is stored in this repository.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs a recent npm CLI; the one bundled with Node may
      # predate it.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The job authenticates with the OIDC token that the permission above mints.
      # npm exchanges the token for a short-lived credential. No npm token exists
      # in the secrets of this repository. npm also makes the provenance
      # attestation without a flag.
      #
      # Version 0.1.0 used a granular access token, because npm cannot configure
      # a trusted publisher for a package that does not exist. That token is
      # revoked. Refer to ADR 143.
      - run: npm publish
