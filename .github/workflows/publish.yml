name: Publish

# Publishing is driven by a GitHub Release, so the tag, the release notes and the
# published version are decided in one place. Bump the version in package.json,
# merge, then cut a release whose tag matches.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required to mint the OIDC token that npm trusted publishing exchanges for
      # a short-lived credential. No npm token is stored in this repository.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs a recent npm CLI; the one bundled with Node may
      # predate it.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # BOOTSTRAP ONLY. Trusted publishing is configured in a package's settings
      # page on npmjs.com, which does not exist until the package does — so the
      # first publish cannot use OIDC. It uses a granular access token instead,
      # which still produces provenance because the repository is public and the
      # job mints an id-token.
      #
      # After 0.1.0 is on the registry: configure the trusted publisher on
      # npmjs.com, revoke the token, and delete both the secret and the `env`
      # block below. The publish step itself does not change.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
